    <style id="theme-vars">
/* Deep Space Cosmic Theme — colors_and_type.css */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
  /* ===== Primary color scale (Nebula Blue) ===== */
  --cosmic-primary-0: #eff6ff;
  --cosmic-primary-50: #dbeafe;
  --cosmic-primary-100: #bfdbfe;
  --cosmic-primary-200: #93c5fd;
  --cosmic-primary-300: #60a5fa;
  --cosmic-primary-400: #3b82f6;
  --cosmic-primary-500: #2563eb;
  --cosmic-primary-600: #1d4ed8;
  --cosmic-primary-700: #1e40af;
  --cosmic-primary-800: #1e3a8a;
  --cosmic-primary-900: #172554;
  --cosmic-primary-950: #0f1838;

  /* ===== Neutral scale ===== */
  --cosmic-neutral-0: #f8fafc;
  --cosmic-neutral-50: #f1f5f9;
  --cosmic-neutral-100: #e2e8f0;
  --cosmic-neutral-200: #cbd5e1;
  --cosmic-neutral-300: #94a3b8;
  --cosmic-neutral-400: #64748b;
  --cosmic-neutral-500: #475569;
  --cosmic-neutral-600: #334155;
  --cosmic-neutral-700: #1e293b;
  --cosmic-neutral-800: #0f172a;
  --cosmic-neutral-900: #050816;
  --cosmic-neutral-950: #020617;

  /* ===== Semantic aliases — Dark mode (default) ===== */
  --cosmic-background: #020617;
  --cosmic-foreground: #f8fafc;
  --cosmic-card: rgba(7, 12, 28, 0.45);
  --cosmic-card-foreground: #f8fafc;
  --cosmic-popover: rgba(7, 12, 28, 0.8);
  --cosmic-popover-foreground: #f8fafc;
  --cosmic-primary: #2563eb;
  --cosmic-primary-foreground: #f8fafc;
  --cosmic-muted: #94a3b8;
  --cosmic-muted-foreground: #94a3b8;
  --cosmic-border: rgba(255, 255, 255, 0.08);
  --cosmic-input: rgba(255, 255, 255, 0.1);
  --cosmic-ring: #2563eb;

  /* ===== Radius scale (restrained) ===== */
  --cosmic-radius-small: 4px;
  --cosmic-radius-medium: 8px;
  --cosmic-radius-large: 12px;
  --cosmic-radius-full: 9999px;

  /* ===== State colors ===== */
  --state-success: #22d3ee;
  --state-warning: #fbbf24;
  --state-error: #f87171;
  --state-info: #7dd3fc;

  /* ===== Typography ===== */
  --cosmic-font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cosmic-font-display: 'Inter', system-ui, -apple-system, sans-serif;
  --cosmic-font-body: 'Inter', system-ui, -apple-system, sans-serif;
}

/* ===== Light mode overrides (not primary, but required for dual-mode) ===== */
html.light {
  --cosmic-background: #f8fafc;
  --cosmic-foreground: #020617;
  --cosmic-card: rgba(255, 255, 255, 0.6);
  --cosmic-card-foreground: #020617;
  --cosmic-popover: rgba(255, 255, 255, 0.9);
  --cosmic-popover-foreground: #020617;
  --cosmic-primary: #2563eb;
  --cosmic-primary-foreground: #f8fafc;
  --cosmic-muted: #94a3b8;
  --cosmic-muted-foreground: #475569;
  --cosmic-border: rgba(0, 0, 0, 0.08);
  --cosmic-input: rgba(0, 0, 0, 0.1);
  --cosmic-ring: #2563eb;
}

/* ===== Dark mode (default for cosmic theme) ===== */
html.dark {
  --cosmic-background: #020617;
  --cosmic-foreground: #f8fafc;
  --cosmic-card: rgba(7, 12, 28, 0.45);
  --cosmic-card-foreground: #f8fafc;
  --cosmic-popover: rgba(7, 12, 28, 0.8);
  --cosmic-popover-foreground: #f8fafc;
  --cosmic-primary: #2563eb;
  --cosmic-primary-foreground: #f8fafc;
  --cosmic-muted: #94a3b8;
  --cosmic-muted-foreground: #94a3b8;
  --cosmic-border: rgba(255, 255, 255, 0.08);
  --cosmic-input: rgba(255, 255, 255, 0.1);
  --cosmic-ring: #2563eb;
}

/* ===== Base typography ===== */
html {
  font-family: var(--cosmic-font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--cosmic-font-body);
  background: var(--cosmic-background);
  color: var(--cosmic-foreground);
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--cosmic-background);
    --color-foreground: var(--cosmic-foreground);
    --color-card: var(--cosmic-card);
    --color-card-foreground: var(--cosmic-card-foreground);
    --color-popover: var(--cosmic-popover);
    --color-popover-foreground: var(--cosmic-popover-foreground);
    --color-primary: var(--cosmic-primary);
    --color-primary-foreground: var(--cosmic-primary-foreground);
    --color-muted: var(--cosmic-muted);
    --color-muted-foreground: var(--cosmic-muted-foreground);
    --color-border: var(--cosmic-border);
    --color-input: var(--cosmic-input);
    --color-ring: var(--cosmic-ring);
    --radius-sm: var(--cosmic-radius-small);
    --radius-md: var(--cosmic-radius-medium);
    --radius-lg: var(--cosmic-radius-large);
  }
  @layer base {
    body { background: var(--cosmic-background); color: var(--cosmic-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
